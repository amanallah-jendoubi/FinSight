server {
    listen 80;

    # Static React build (served directly by Nginx)
    root /usr/share/nginx/html;
    index index.html;

    # 1. API requests → Express (adjust prefix if you didn't add /api yet)
    location /api/ {
        proxy_pass http://express-app:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. WebSocket (Socket.IO) → Express, needs upgrade headers
    location /socket.io/ {
        proxy_pass http://express-app:3500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # 3. Everything else → serve the React SPA, fallback to index.html
    location / {
        try_files $uri /index.html;
    }
}