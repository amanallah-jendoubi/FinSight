services:
  db:
    image: postgres:15.1-alpine
    env_file:
      - backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  express-app:
    container_name: express-app-container
    build:
      context: backend/.
      target: production
    env_file:
      - backend/.env
    depends_on:
      - db

  ml-service:
    container_name: ml-service-container
    build:
      context: ml-service/.
    depends_on:
      - express-app
  
  frontend:
    container_name: frontend-app-container
    build:
      context: frontend/.
      target: production
    ports:
      - "80:80"
    depends_on:
      - express-app

volumes:
  pgdata: